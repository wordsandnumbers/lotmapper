name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-push:
    name: Build & Push Images
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      short-sha: ${{ steps.versions.outputs.short-sha }}

    steps:
      - uses: actions/checkout@v4

      - name: Extract versions
        id: versions
        run: |
          echo "short-sha=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT
          echo "SHORT_SHA=$(git rev-parse --short HEAD)" >> $GITHUB_ENV
          echo "SEMVER=$(jq -r .version package.json)" >> $GITHUB_ENV

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push backend
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          push: true
          build-args: |
            BUILD_SHA=${{ env.SHORT_SHA }}
            SEMVER=${{ env.SEMVER }}
          tags: |
            ghcr.io/wordsandnumbers/parking-lot-app/backend:latest
            ghcr.io/wordsandnumbers/parking-lot-app/backend:git-${{ env.SHORT_SHA }}
          cache-from: type=gha,scope=backend
          cache-to: type=gha,scope=backend,mode=max

      - name: Build and push frontend
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          push: true
          build-args: |
            BUILD_SHA=${{ env.SHORT_SHA }}
            SEMVER=${{ env.SEMVER }}
          tags: |
            ghcr.io/wordsandnumbers/parking-lot-app/frontend:latest
            ghcr.io/wordsandnumbers/parking-lot-app/frontend:git-${{ env.SHORT_SHA }}
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,scope=frontend,mode=max

  deploy:
    name: Deploy to Droplet
    runs-on: ubuntu-latest
    needs: build-push
    env:
      SHORT_SHA: ${{ needs.build-push.outputs.short-sha }}

    steps:
      - name: Deploy
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.DO_HOST }}
          username: ${{ secrets.DO_USER }}
          key: ${{ secrets.DO_SSH_KEY }}
          envs: SHORT_SHA
          script: |
            set -e
            cd /opt/lotmapper

            git fetch origin main
            git checkout main
            git pull --ff-only origin main

            # Pin the deployed version in .env
            if grep -q "^IMAGE_TAG=" .env; then
              sed -i "s/^IMAGE_TAG=.*/IMAGE_TAG=git-${SHORT_SHA}/" .env
            else
              echo "IMAGE_TAG=git-${SHORT_SHA}" >> .env
            fi

            # Pull new images (not db/rabbitmq/caddy)
            docker compose -f docker-compose.yml -f docker-compose.prod.yml pull backend worker frontend

            # Run migrations in a one-off container using the new image, before
            # recreating the long-running services. This keeps the migration off
            # the critical path of the backend/worker startup (which load a large
            # CV model into memory and were previously racing with `alembic exec`
            # for RAM, causing OOM kills) and ensures the schema is ready before
            # the new app code starts.
            docker compose -f docker-compose.yml -f docker-compose.prod.yml run --rm -T --no-deps backend alembic upgrade head

            # Remove orphaned containers left behind by an interrupted recreate
            # (docker compose renames the old container to a hash-prefixed temp
            # name before removing it; if that step is interrupted, the temp
            # container lingers and collides with the next recreate)
            docker ps -a --format '{{.Names}}' | grep -E '^[0-9a-f]+_lotmapper-(backend|worker|frontend)-1$' | xargs -r docker rm -f

            # Restart app services on the new images
            docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d --no-deps backend worker frontend

            # Reclaim space from prior image versions now that new ones are live
            docker image prune -af
            docker builder prune -af
